{% extends "base.html" %}
{% block title %}Data Guru - Jadwal App{% endblock %}
{% block page_title %}Data Guru{% endblock %}
{% block content %}
<div class="card">
  <div class="card-body p-0">
    <form method="POST" id="guruForm">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <input type="hidden" name="hapus_ids" id="hapus_ids" value="">
      <table class="table table-hover mb-0">
        <thead class="table-light">
          <tr><th>No</th><th>Nama Guru</th><th style="width:60px">Aksi</th></tr>
        </thead>
        <tbody>
          {% for g in guru_list %}
          <tr>
            <td>{{ loop.index }}</td>
            <td><input type="text" name="nama_{{ g.id }}" value="{{ g.nama }}" class="form-control form-control-sm"></td>
            <td><button type="button" class="btn btn-outline-danger btn-sm" onclick="markDelete({{ g.id }}, this)"><i class="bi bi-x"></i></button></td>
          </tr>
          {% endfor %}
          <tr class="table-info">
            <td>#</td>
            <td><input type="text" name="nama_baru" class="form-control form-control-sm" placeholder="Nama guru baru..."></td>
            <td></td>
          </tr>
        </tbody>
      </table>
      <div class="p-3">
        <button type="submit" class="btn btn-primary"><i class="bi bi-floppy"></i> Simpan</button>
      </div>
    </form>
  </div>
</div>
<script>
function markDelete(id, btn) {
  const hapus = document.getElementById('hapus_ids');
  const vals = hapus.value ? hapus.value.split(',') : [];
  if (!vals.includes(String(id))) {
    vals.push(String(id));
    hapus.value = vals.join(',');
    btn.closest('tr').style.textDecoration = 'line-through';
    btn.closest('tr').style.opacity = '0.5';
  }
}
</script>
{% endblock %}
